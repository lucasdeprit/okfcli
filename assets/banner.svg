<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="okfcli — project wikis your agents can trust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1a1440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1120" cy="60" r="180" fill="#a78bfa" opacity=".10"/>
  <circle cx="1000" cy="300" r="140" fill="#38bdf8" opacity=".08"/>

  <!-- logo mark -->
  <g transform="translate(90 92)">
    <rect width="136" height="136" rx="30" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <path d="M38 52l26 20-26 20" fill="none" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="76" y="88" width="30" height="9" rx="4.5" fill="#e2e8f0"/>
  </g>

  <text x="262" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="84" font-weight="700" fill="#f8fafc">okfcli</text>
  <text x="264" y="204" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="30" fill="url(#accent)" font-weight="600">Project wikis your coding agents can trust.</text>
  <text x="264" y="244" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="20" fill="#94a3b8">Same structure in every project · Open Knowledge Format</text>

  <!-- floating page cards -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15">
    <g transform="translate(990 52) rotate(-4)"><rect width="230" height="72" rx="12" fill="#111936" stroke="#38bdf8" stroke-opacity=".6"/>
      <text x="16" y="30" fill="#38bdf8">patterns/</text><text x="16" y="54" fill="#cbd5e1">state-management.md</text></g>
    <g transform="translate(1010 140) rotate(3)"><rect width="230" height="72" rx="12" fill="#111936" stroke="#a78bfa" stroke-opacity=".6"/>
      <text x="16" y="30" fill="#a78bfa">architecture/</text><text x="16" y="54" fill="#cbd5e1">overview.md</text></g>
    <g transform="translate(985 232) rotate(-2)"><rect width="230" height="52" rx="12" fill="#111936" stroke="#34d399" stroke-opacity=".6"/>
      <text x="16" y="32" fill="#34d399">✓ verified by human</text></g>
    </g>
</svg>
