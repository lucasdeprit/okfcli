name: Publish

# Publishes to npm when a GitHub Release is published. No token is stored: npm
# trusts this workflow through OIDC ("trusted publishing", set up once on
# npmjs.com for the package), and adds a provenance attestation automatically.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which trusted publishing requires
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: The release tag must match package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npm publish
